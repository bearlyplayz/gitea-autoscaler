name: Build and Push

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: gitea.bearly.local/bearlyprojects/gitea-autoscaler/autoscaler

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Extract semver from the tag (v0.1.0 -> 0.1.0)
      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ gitea.ref_name }}}"
          VER="${TAG#v}"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"
          echo "Version: $VER (tag: $TAG)"

      # Bump version in Cargo.toml + regenerate lock file
      - name: Update Cargo version
        run: |
          VER="${{ steps.version.outputs.ver }}"
          sed -i "s/^version = \".*\"/version = \"${VER}\"/" Cargo.toml
          # Regenerate lock file so it matches the new version
          cargo generate-lockfile
          echo "Cargo.toml version set to $VER"

      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.bearly.local
          username: ${{ gitea.actor }}
          password: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.ver }}

      # Commit the updated Cargo.toml and Cargo.lock back to main
      - name: Push version bump to main
        run: |
          VER="${{ steps.version.outputs.ver }}"
          git config user.name  "Gitea Actions"
          git config user.email "actions@bearly.local"
          if git diff --quiet -- Cargo.toml Cargo.lock; then
            echo "No changes to commit"
            exit 0
          fi
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $VER [skip ci]"
          BUMP_COMMIT="$(git rev-parse HEAD)"
          git fetch origin main
          git switch -C ci/version-bump origin/main
          git cherry-pick "$BUMP_COMMIT"
          git push origin HEAD:refs/heads/main

      # Rolling restart so the cluster picks up the new image when cluster access is available
      - name: Restart deployment
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "kubectl is not installed on this runner; skipping deployment restart"
            exit 0
          fi
          if ! kubectl config current-context >/dev/null 2>&1; then
            echo "kubectl is installed but no kubeconfig is available; skipping deployment restart"
            exit 0
          fi
          kubectl -n gitea rollout restart deployment/gitea-autoscaler
          kubectl -n gitea rollout status deployment/gitea-autoscaler --timeout=120s
