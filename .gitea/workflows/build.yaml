name: Build and Push

on:
  push:
    tags:
      - "v*"

env:
  IMAGE: gitea.bearly.local/bearlyprojects/gitea-autoscaler
  IMAGE_CACHE: gitea.bearly.local/bearlyprojects/gitea-autoscaler:buildcache

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Extract semver from the tag (v0.1.0 -> 0.1.0)
      - name: Resolve version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME:-${{ gitea.ref_name }}}"
          VER="${TAG#v}"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"
          echo "Version: $VER (tag: $TAG)"

      # Bump version in Cargo.toml + regenerate lock file
      - name: Update Cargo version
        run: |
          VER="${{ steps.version.outputs.ver }}"
          sed -i "s/^version = \".*\"/version = \"${VER}\"/" Cargo.toml
          # Regenerate lock file so it matches the new version
          cargo generate-lockfile
          echo "Cargo.toml version set to $VER"

      # Login to the Gitea container registry
      - name: Login to Gitea Registry
        uses: docker/login-action@v3
        with:
          registry: gitea.bearly.local
          username: ${{ gitea.actor }}
          password: ${{ secrets.DEPLOY_REPO_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # Build and push both latest and version tags
      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.ver }}
          cache-from: type=registry,ref=${{ env.IMAGE_CACHE }}
          cache-to: type=registry,ref=${{ env.IMAGE_CACHE }},mode=max

      # Commit the updated Cargo.toml and Cargo.lock back to master
      - name: Push version bump to master
        run: |
          VER="${{ steps.version.outputs.ver }}"
          git config user.name  "Gitea Actions"
          git config user.email "actions@bearly.local"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to $VER [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/master

      # Rolling restart so the cluster picks up the new image
      - name: Restart deployment
        run: |
          kubectl -n gitea rollout restart deployment/gitea-autoscaler
          kubectl -n gitea rollout status deployment/gitea-autoscaler --timeout=120s
